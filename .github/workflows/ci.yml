name: CI - Build, test and push Docker image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: rate-my-face
  TEST_IMAGE_URL: https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/lena.jpg

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (model load is verified inside the Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          build-args: |
            APP_VERSION=1.0.${{ github.run_number }}
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container (health + real analyze request)
        run: |
          docker run -d --name smoke -p 8000:8000 ${{ env.IMAGE_NAME }}:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then echo; break; fi
            sleep 1
          done
          curl -fsSL "$TEST_IMAGE_URL" -o face.jpg
          resp=$(curl -fsS -F "file=@face.jpg;type=image/jpeg" http://127.0.0.1:8000/api/analyze)
          echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['ok'] and d['revision']=='${{ github.sha }}', d; print('analyze OK, score =', d['total_score'], 'revision =', d['revision'])"
          docker rm -f smoke

      - name: Push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            APP_VERSION=1.0.${{ github.run_number }}
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha
